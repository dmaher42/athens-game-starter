<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" />
    <title>Please Refresh</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at top, #f5f5f5, #d9d9d9);
        color: #1f1f1f;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(circle at top, #1f1f1f, #121212);
          color: #f5f5f5;
        }
      }

      main {
        text-align: center;
        padding: 2rem;
        max-width: 26rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 2.5rem);
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reload Athens</h1>
      <p>
        Something went wrong while loading the experience. Please refresh the page to try
        again.
      </p>
    </main>
  </body>
</html>
