name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.57 in package-lock.json supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Install Playwright system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # Verification launches Chromium in headless mode only.
      - name: Install Playwright headless Chromium
        timeout-minutes: 5
        run: npx playwright install --only-shell chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Verify
        run: npm run verify

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
