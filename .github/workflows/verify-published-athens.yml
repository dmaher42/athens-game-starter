name: Verify published Athens
on:
  push:
    branches: [codex/verify-athens-public-20261106]
permissions:
  contents: read
jobs:
  live-smoke:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test published game in Chrome
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN || "/usr/bin/google-chrome",
            args: ["--use-gl=angle", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"]
          });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const errors = [];
          page.on("pageerror", error => errors.push(error.message));
          page.on("console", msg => { if (msg.type() === "error") errors.push(msg.text()); });
          try {
            const response = await page.goto("https://dmaher42.github.io/athens-game-starter/", {
              waitUntil: "domcontentloaded", timeout: 90000
            });
            assert.equal(response.status(), 200, "Public page did not return HTTP 200");
            await page.waitForFunction(() =>
              typeof window.render_game_to_text === "function" ||
              document.body.innerText.includes("We couldn't finish loading Athens"),
              null, { timeout: 180000 });
            const failed = await page.locator("body").innerText();
            assert.ok(!failed.includes("We couldn't finish loading Athens"), "Game showed a loading error");
            await page.waitForFunction(() => {
              try { return Boolean(JSON.parse(window.render_game_to_text()).player); }
              catch { return false; }
            }, null, { timeout: 60000 });
            assert.ok(await page.locator("canvas").count() > 0, "Game canvas is missing");
            const initial = await page.evaluate(() => JSON.parse(window.render_game_to_text()).player);
            await page.keyboard.down("w");
            await page.waitForTimeout(4000);
            await page.keyboard.up("w");
            let final = await page.evaluate(() => JSON.parse(window.render_game_to_text()).player);
            let moved = Math.hypot(final.x - initial.x, final.z - initial.z);
            if (moved < 0.05) {
              await page.keyboard.down("a");
              await page.waitForTimeout(4000);
              await page.keyboard.up("a");
              final = await page.evaluate(() => JSON.parse(window.render_game_to_text()).player);
              moved = Math.hypot(final.x - initial.x, final.z - initial.z);
            }
            await page.screenshot({ path: "athens-live-smoke.png" });
            console.log(JSON.stringify({ url: page.url(), title: await page.title(), initial, final, moved, errors }));
            assert.ok(moved >= 0.05, "Player did not move in response to keyboard input");
            assert.deepEqual(errors, [], "Browser reported errors");
          } finally {
            await page.screenshot({ path: "athens-live-smoke.png" }).catch(() => {});
            await browser.close();
          }
          NODE
      - name: Save live test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athens-live-smoke
          path: athens-live-smoke.png
          if-no-files-found: ignore

  headless-build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check published release identity
        run: |
          curl -fsSL https://dmaher42.github.io/athens-game-starter/assets/index-R7CvCpwi.js -o /tmp/athens-published.js
          sha256sum /tmp/athens-published.js docs/assets/index-R7CvCpwi.js
      - name: Inspect current city baseline
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from "node:crypto";
          import * as THREE from "three";
          import {generateCityGrid} from "./src/world/cityPlan.js";
          import {CITY_STREETS, CITY_QUARTERS, AGORA_FRONTAGES, cityQuarterRecipe} from "./src/world/neighbourhoodLayout.js";
          import {createLayoutFixture} from "./verification/city-layout.fixture.mjs";
          const hash = value => createHash("sha256").update(JSON.stringify(value)).digest("hex");
          const {cells, roadNetwork} = generateCityGrid(() => 4);
          const data = cells.map(c => ({x:c.position.x,z:c.position.z,type:c.type,district:c.district,buildable:c.buildable,gridX:c.gridX,gridZ:c.gridZ}));
          const roadTriangles = roadNetwork.reduce((s,r) => s + r.renderRibbon(new THREE.Vector3(0,4,0),()=>4).geometry.index.count/3, 0);
          const {stats} = await createLayoutFixture();
          const typesAt=(x,z) => Array.from({length:1000},(_,i)=>cityQuarterRecipe(x,z,(i+.5)/1000)?.type);
          console.log(JSON.stringify({baselineProbe: {streetHash:hash(roadNetwork.map(r=>({width:r.width,type:r.type,points:r.points.map(p=>[p.x,p.z])}))),gridHash:hash(data),roadTriangles,city:stats,streets:CITY_STREETS.length,quarters:CITY_QUARTERS.length,frontages:AGORA_FRONTAGES.length,workshop:typesAt(-170,38).filter(x=>x==="workshop").length,homes:typesAt(-65,115).filter(x=>x==="house").length,blendA:cityQuarterRecipe(-139,85,.001),blendB:cityQuarterRecipe(-138.9,85,.001)}}));
          NODE
      - name: Install system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Install headless Chromium only
        timeout-minutes: 5
        run: npx playwright install --only-shell chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Verify complete build
        run: npm run verify
