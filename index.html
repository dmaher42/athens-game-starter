<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./docs/favicon.ico" />
    <title>Athens Game Starter</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Provide bare module fallbacks when running without a bundler.
      const isFileProtocol = window.location.protocol === "file:";
      const isViteDevServer = Boolean(
        document.querySelector('script[type="module"][src="/@vite/client"]'),
      );

      if (isFileProtocol || !isViteDevServer) {
        const importMap = {
          imports: isFileProtocol
            ? {
                three: "./node_modules/three/build/three.module.js",
                "three/examples/jsm/": "./node_modules/three/examples/jsm/",
                "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js",
              }
            : {
                three:
                  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/examples/jsm/":
                  "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
                "three-mesh-bvh":
                  "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.1/build/index.module.js",
              },
        };

        const script = document.createElement("script");
        script.type = "importmap";
        script.textContent = JSON.stringify(importMap, null, 2);
        document.currentScript?.parentNode?.insertBefore(
          script,
          document.currentScript.nextSibling,
        );
      }

      // In production builds (Vite), the entry point is injected automatically.
      // We only manually inject the entry point for dev server or bundleless execution.
      // We also removed the auto-redirect to docs/ to prevent infinite loops on GitHub Pages.

      const moduleScript = document.createElement("script");
      moduleScript.type = "module";

      // If we are in a Vite dev server, load main.ts.
      // If we are file protocol, we might be testing bundleless, load main.bundleless.js.
      // If we are neither (e.g. deployed but this script is still here because it wasn't stripped),
      // we assume the build injected its own script, OR we are trying to run bundleless hosted.
      // However, for the starter kit, we prioritize the dev server flow.

      if (isViteDevServer) {
        moduleScript.src = "./src/main.ts";
        document.currentScript?.parentNode?.insertBefore(
          moduleScript,
          document.currentScript.nextSibling,
        );
      } else if (isFileProtocol) {
        moduleScript.src = "./src/main.bundleless.js";
        document.currentScript?.parentNode?.insertBefore(
          moduleScript,
          document.currentScript.nextSibling,
        );
      }
    </script>
  </body>
</html>
